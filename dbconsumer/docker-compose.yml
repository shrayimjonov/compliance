services:
  app:
    container_name: dbconsumer-service
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx2500m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=16m"
    ports:
      - "8088:8088"
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 1g